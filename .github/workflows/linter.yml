name: PHP Linting with Laravel Pint Action

on:
  pull_request:
  push:
    branches:
      - "main"
      - "develop"

jobs:
  phplint:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
          with:
            fetch-deps: 0

        - name: Laravel Pint
          uses: aglipanci/laravel-pint-action@2.6
          with:
            preset: laravel
            verboseMode: false
            testMode: true
            configPath: "pint.json"
            pintVersion: 1.32.0
            onlyDirty: true
            onlyDiff: "main"
